server:
  port: 8085

spring:
  application:
    name: waitlist-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketflow}?currentSchema=${DB_SCHEMA:waitlist}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow_pw}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:waitlist}
    open-in-view: false

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:waitlist}
    default-schema: ${DB_SCHEMA:waitlist}
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketflow}
    password: ${RABBITMQ_PASSWORD:ticketflow_pw}
    virtual-host: ${RABBITMQ_VHOST:/ticketflow}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
        default-requeue-rejected: false

waitlist:
  offer:
    ttl-seconds: ${WAITLIST_OFFER_TTL_SECONDS:900}
    sweep-interval-ms: ${WAITLIST_SWEEP_INTERVAL_MS:30000}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}

services:
  seat-hold:
    base-url: ${SEAT_HOLD_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticketflow.waitlist: INFO
