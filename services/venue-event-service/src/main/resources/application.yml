server:
  port: 8082

spring:
  application:
    name: venue-event-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketflow}?currentSchema=${DB_SCHEMA:venue_event}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:venue_event}
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:venue_event}
    default-schema: ${DB_SCHEMA:venue_event}
    locations: classpath:db/migration
    baseline-on-migrate: true

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ticketflow.venueevent: INFO
    org.springframework.security: WARN
