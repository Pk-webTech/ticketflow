server:
  port: 8083

spring:
  application:
    name: seat-hold-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketflow}?currentSchema=${DB_SCHEMA:seat_hold}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:seat_hold}
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:seat_hold}
    default-schema: ${DB_SCHEMA:seat_hold}
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketflow}
    password: ${RABBITMQ_PASSWORD:ticketflow_pw}
    virtual-host: ${RABBITMQ_VHOST:/ticketflow}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
        default-requeue-rejected: false # let failed conversions dead-letter instead of retry-looping forever

seat-hold:
  ttl-seconds: ${SEAT_HOLD_TTL_SECONDS:600}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}

services:
  venue-event:
    base-url: ${VENUE_EVENT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ticketflow.seathold: INFO
    org.springframework.security: WARN
