server:
  port: 8084

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketflow}?currentSchema=${DB_SCHEMA:booking}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:booking}
    open-in-view: false

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:booking}
    default-schema: ${DB_SCHEMA:booking}
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketflow}
    password: ${RABBITMQ_PASSWORD:ticketflow_pw}
    virtual-host: ${RABBITMQ_VHOST:/ticketflow}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}

services:
  venue-event:
    base-url: ${VENUE_EVENT_SERVICE_URL:http://localhost:8082}
  seat-hold:
    base-url: ${SEAT_HOLD_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticketflow.booking: INFO
    org.springframework.security: WARN
