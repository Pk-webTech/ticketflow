server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: every unknown path must fall through to index.html or a hard refresh
  # on /bookings or /waitlist/offer/<token> would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
