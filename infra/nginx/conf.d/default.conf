# =============================================================================
# TicketFlow API Gateway
# Routes /api/<service>/... to the matching Spring Boot microservice.
# Routes /ws/... to seat-hold-service for STOMP/SockJS WebSocket connections.
# Everything else falls through to the React frontend.
#
# NOTE ON TRAILING SLASHES: proxy_pass MUST NOT end in `/` here. With a
# trailing slash Nginx strips the matched location prefix, so `/api/auth/login`
# would arrive at auth-service as `/login` — which no controller maps — giving
# a 404 on every single authenticated route.
#
# Each upstream is defined with `server <container>:<port>` — scale a service
# with `docker compose up -d --scale booking-service=3 <profile flag>` and add
# extra `server` lines (or use Docker DNS round-robin) for real load balancing.
# =============================================================================

upstream auth_upstream {
    least_conn;
    server auth-service:8081;
}

upstream venue_event_upstream {
    least_conn;
    server venue-event-service:8082;
}

upstream seat_hold_upstream {
    ip_hash; # WebSocket connections should stick to the same backend instance
    server seat-hold-service:8083;
}

upstream booking_upstream {
    least_conn;
    server booking-service:8084;
}

upstream waitlist_upstream {
    least_conn;
    server waitlist-service:8085;
}

upstream notification_upstream {
    least_conn;
    server notification-service:8086;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # ---- Auth Service ------------------------------------------------------
    location /api/auth/ {
        proxy_pass http://auth_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- Venue & Event Service ----------------------------------------------
    location /api/venues/ {
        proxy_pass http://venue_event_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/events/ {
        proxy_pass http://venue_event_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Flat show lookup (/api/shows/{id}) — used by the frontend and by
    # booking/waitlist services that only carry a showId.
    location /api/shows/ {
        proxy_pass http://venue_event_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- Seat Hold Service (REST) --------------------------------------------
    location /api/seats/ {
        proxy_pass http://seat_hold_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- Seat Hold Service (WebSocket: STOMP/SockJS real-time seat map) ------
    location /ws/ {
        proxy_pass http://seat_hold_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Booking Service ------------------------------------------------------
    location /api/bookings/ {
        proxy_pass http://booking_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- Waitlist Service -------------------------------------------------------
    location /api/waitlist/ {
        proxy_pass http://waitlist_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- Notification Service (internal QR ticket asset fetch, if exposed) ------
    location /api/notifications/ {
        proxy_pass http://notification_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- Frontend (React SPA) --------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
